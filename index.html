<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Aurelio sopravvive all'Italia</title>
  <meta name="theme-color" content="#1a1423">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aurelio">
  <style>
    @font-face { font-family: 'PressStart'; src: url('assets/fonts/pressstart.woff2') format('woff2'); font-display: block; }
    html, body { margin: 0; height: 100%; background: #1a1423; overflow: hidden; overscroll-behavior: none;
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #game { position: fixed; inset: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0; }
    canvas { image-rendering: pixelated; }
    /* forza il caricamento del font prima che parta il gioco */
    .preload { font-family: 'PressStart'; position: absolute; opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="game"></div>
  <span class="preload">.</span>
  <script src="lib/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
